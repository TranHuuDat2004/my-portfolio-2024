<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Liên hệ với Trần Hữu Đạt để hợp tác hoặc hỏi đáp."
        data-translate-key="metaDescription" />
    <meta name="author" content="Trần Hữu Đạt" />
    <title>Liên hệ - Trần Hữu Đạt</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />

    <style>
        body {
            cursor: none;
            position: relative;
        }

        a,
        button,
        input[type="submit"],
        .form-control,
        .current-flag {
            cursor: url('assets/hand.png'), auto;
        }

        /* CSS CHO NÚT CHUYỂN NGÔN NGỮ */
        .language-switcher {
            position: relative;
            display: inline-block;
            margin-left: 20px;
        }

        .language-switcher .current-flag img {
            width: 32px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .language-dropdown {
            display: none;
            position: absolute;
            top: 120%;
            right: 0;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            padding: 8px;
            z-index: 1100;
            width: 180px;
            border: 1px solid #eee;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
            pointer-events: none;
        }

        .language-dropdown.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .language-dropdown a {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            text-decoration: none;
            color: #333;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .language-dropdown a:hover {
            background-color: #f0f2f5;
        }

        .language-dropdown img {
            width: 24px;
            margin-right: 12px;
            border-radius: 3px;
        }

        /* CSS CHO CON TRỎ TÙY CHỈNH */
        .cursor-element {
            position: fixed;
            display: flex;
            align-items: center;
            pointer-events: none;
            z-index: 1070;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        .cursor-element.visible {
            opacity: 1;
        }

        .cursor-element img {
            width: 28px;
            height: auto;
            margin-right: 8px;
        }

        .cursor-element .cursor-text {
            background-color: #4CAF50;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.95em;
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.15);
            font-weight: bold;
            opacity: 1;
            transition: opacity 0.2s ease-in-out;
        }

        .cursor-element .cursor-text.fade-out {
            opacity: 0;
        }

        /* Thêm vào cuối file CSS của bạn */
        footer.bg-dark a.text-white-50 {
            transition: color 0.3s ease-in-out;
        }

        footer.bg-dark a.text-white-50:hover {
            color: #ffffff !important;
            /* Dùng !important để ghi đè bootstrap nếu cần */
            text-decoration: underline;
        }

        footer a {
            color: #adb5bd;
            /* Màu chữ liên kết trong footer */
            text-decoration: none;
        }
    </style>
</head>

<body class="d-flex flex-column">
    <main class="flex-shrink-0">
        <!-- Navigation-->
        <header-placeholder></header-placeholder>

        <!-- Page content-->
        <section class="py-5">
            <div class="container px-5">
                <div class="bg-light rounded-4 py-5 px-4 px-md-5">
                    <div class="text-center mb-5">
                        <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 mb-3"><i
                                class="bi bi-envelope"></i></div>
                        <h1 class="fw-bolder" data-translate-key="contactTitle">Liên Lạc</h1>
                        <p class="lead fw-normal text-muted mb-0" data-translate-key="contactSubtitle">Tôi rất mong nhận
                            được phản hồi từ bạn! Hãy kết nối nhé.</p>
                    </div>
                    <div class="row gx-5 justify-content-center">
                        <div class="col-lg-8 col-xl-6">
                            <form id="contactForm" action="https://formspree.io/f/xpwozknb" method="POST">
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="name" name="name" type="text" placeholder="Nhập tên của bạn..." />
                                    <label for="name" data-translate-key="formName">Họ và tên</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="email" name="_replyto" type="email" placeholder="name@example.com" />
                                    <label for="email" data-translate-key="formEmail">Địa chỉ email</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="phone" name="phone" type="tel" placeholder="(123) 456-7890" />
                                    <label for="phone" data-translate-key="formPhone">Số điện thoại (Không bắt
                                        buộc)</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <textarea class="form-control" id="message" name="message" placeholder="Nhập tin nhắn của bạn ở đây..." style="height: 10rem"></textarea>
                                    <label for="message" data-translate-key="formMessage">Tin nhắn</label>
                                </div>

                                <div class="d-grid"><button class="btn btn-success btn-lg" id="submitButton"
                                        type="submit" data-translate-key="formSubmitButton">Gửi</button></div>
                            </form>
                            <hr class="my-5">
                            <div class="text-center">
                                <p class="lead fw-normal text-muted mb-2" data-translate-key="directContact">Hoặc liên
                                    hệ trực tiếp:</p>
                                <p class="mb-1"><i class="bi bi-envelope-fill text-primary me-2"></i><a
                                        href="mailto:huudat.peashooer@gmail.com">huudat.peashooer@gmail.com</a></p>
                                <p class="mb-0">
                                    <i class="bi bi-linkedin text-primary me-2"></i><a
                                        href="https://linkedin.com/in/tranhuudat2004" target="_blank"
                                        rel="noopener noreferrer" data-translate-key="linkedinProfile">Hồ sơ LinkedIn
                                        của tôi</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
<!-- Footer Chuyên nghiệp & Có Cấu trúc -->
    <footer-placeholder></footer-placeholder>


    <div class="cursor-element">
        <img src="assets/cursor.png" alt="Custom Cursor Icon">
        <span class="cursor-text" data-translate-key="cursorText">Hữu Đạt</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
